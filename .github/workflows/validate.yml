name: Validate Harness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  structural-validation:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && !github.event.deleted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Validate repository contracts
        env:
          SDD_REQUIRE_ARCHIVE: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
          SDD_BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERSAT_STRUCTURAL_ONLY: '1'
        run: |
          test -n "$SDD_BASELINE"
          if [[ "$SDD_REQUIRE_ARCHIVE" == "true" ]]; then
            ./scripts/validate/run.sh --baseline "$SDD_BASELINE" --require-archive
          else
            ./scripts/validate/run.sh --baseline "$SDD_BASELINE"
          fi
  quality:
    if: github.event_name == 'pull_request' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Check coding conventions and changelog
        run: bash scripts/validate/quality.sh --root . --github-event "$GITHUB_EVENT_PATH"

  documentation-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Report documentation rules
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha }}
          DOCS_TARGET: ${{ github.sha }}
        run: |
          bash scripts/validate/documentation.sh --root "$GITHUB_WORKSPACE" \
            --base "$DOCS_BASE" --target "$DOCS_TARGET" --summary "$GITHUB_STEP_SUMMARY"
